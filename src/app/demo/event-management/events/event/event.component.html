<div class="event-container">

  <div class="header-bar">
    <h2>Event & Task Calendar</h2>
    <button class="btn btn-primary" (click)="showModal = true">+ Add New Event</button>
  </div>

   <!-- WHITE CARD WRAPPER (like screenshot) -->
  <div class="calendar-card">
    <div class="calendar-inner">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>


  <!-- MODAL -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-box">
      <h4>{{ editMode ? 'Edit Event' : 'Create Event' }}</h4>

      <div class="form-grid">
        <label>Title
          <input type="text" class="form-control" placeholder="Title" [(ngModel)]="form.title">
        </label>
        
        <label>Description
          <textarea class="form-control" placeholder="Description" [(ngModel)]="form.description"></textarea>
        </label>

        <label name="rfcEventType">Event Type
          <select class="form-select" [(ngModel)]="form.rfcEventType" name="rfcEventType">
            <option value="" selected>Choose Event Type</option>
            <option *ngFor="let item of eventTypeOptions" [value]="item.key">
              {{ item.value }}
            </option>
          </select>
        </label>

        <label name="rfcVehiclePriority">Vehicle Priority
          <select class="form-select" [(ngModel)]="form.rfcVehiclePriority" name="rfcVehiclePriority">
            <option value="" selected>Choose Priority</option>
            <option *ngFor="let priority of vehiclePriorityOptions" [value]="priority.key">
              {{priority.value}}
            </option>
          </select>          
        </label>

        <label name="rfcBookingStatus">Booking Status
          <select class="form-select" [(ngModel)]="form.rfcBookingStatus" name="rfcBookingStatus">
            <option value="" selected>Choose Booking Status</option>
            <option *ngFor="let status of bookingStatusOptions" [value]="status.key">
              {{status.value}}
            </option>
          </select>          
        </label>

        <label name="rfcDepartment">Department
          <select class="form-select" [(ngModel)]="form.rfcDepartment" name="rfcDepartment">
            <option value="" selected>Choose Department</option>
            <option *ngFor="let item of departmentOptions" [value]="item.key">
              {{ item.value }}
            </option>
          </select>
        </label>

        <label name="rfcEventProgress">Event Progress
            <select class="form-select" [(ngModel)]="form.rfcEventProgress" name="rfcEventProgress">
              <option value="">Event Progress</option>
              <option *ngFor="let item of progressOptions" [value]="item.key">
                {{ item.value }}
              </option>
            </select>
        </label>


        <label  style="margin-top: 30px; display: inline-block;">
          <input type="checkbox" [(ngModel)]="form.privateEvent"> 🔒 Private Event
        </label>

        <label>
          <input type="checkbox" [(ngModel)]="form.departmentEvent"> 👥 Department Event
        </label>

        <label>
          <input type="checkbox" [(ngModel)]="form.vehicleUpdate"> 🌐 Vehicle Update
        </label>

        <label>StartDate
          <input type="date" class="form-control" [(ngModel)]="form.startDate">
        </label>

        <label>EndDate
          <input type="date" class="form-control" [(ngModel)]="form.endDate">
        </label>

        <label>DueDate
          <input type="date" class="form-control" [(ngModel)]="form.dueDate">
        </label>

      </div>

      <div class="modal-actions">
        <button class="btn btn-primary px-5" (click)="saveEvent()" *ngIf="!editMode">Submit</button>
        <button class="btn btn-success px-5" (click)="saveEvent()" *ngIf="editMode">Update</button>
        <button class="btn btn-secondary" (click)="close()">Cancel</button>
        <button class="btn btn-danger" *ngIf="editMode" (click)="deleteEvent()">Delete</button>
      </div>
    </div>
  </div>
</div>
